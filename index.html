<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Conversor de Moedas</title>
</head>
<body>
    <img src="./assets/logo.gif" alt="logo-conversor-moedas" class="logo">
    <main>
        <label>
            <p>converter <b>de</b></p>
            <select>
                <option>R$ Real Brasileiro</option>
            </select>
        </label>

        <label>
            <p>converter <b>para</b></p>
            <select>
                <option>US$ Dólar Americano</option>
                <option>€ Euro</option>
                <option>₿ Bitcoin</option>
            </select>           
        </label>

        <label>
            <p>Valor</p>
            <input class="input-currency" type="number" placeholder="10000,00">
        </label>

        <button class="convert-button">Converter</button>

        <section>
            <div class="converter">
                <img src="./assets/brasil.png" alt="Valor-a-converter">
                <p class="currency">Real</p>
                <p class="currency-value">R$ 0,00</p>
            </div>

            <img src="./assets/seta.png" alt="Seta">

            <div class="convertido">
                <img src="./assets/usa.png" alt="Valor-convertido">
                <p class="currency">Dólar</p>
                <p class="currency-value">US$ 0.0</p>
            </div>
        </section>
    </main>

    
</body>
<script src="./script.js"></script>
</html>
