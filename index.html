<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Conversor de Moedas</title>
</head>
<body>
    <img src="./assets/logo.gif" alt="logo-conversor-moedas" class="logo">
    <main>
        <label>
            <p>converter <b>de</b></p>
            <select class="currency-to-convert">
                <option value="real">R$ Real Brasileiro</option>
                <option value="dolar">US$ Dólar Americano</option>
                <option value="euro">€ Euro</option>
                <option value="bitcoin">₿ Bitcoin</option>
                <option value="libra">£ Libra</option>
            </select>
        </label>

        <label>
            <p>converter <b>para</b></p>
            <select class="currency-converted">
                <option value= "real">R$ Real Brasileiro</option>
                <option value="dolar">US$ Dólar Americano</option>
                <option value="euro">€ Euro</option>
                <option value="bitcoin">₿ Bitcoin</option>
                <option value="libra">£ Libra</option>
            </select>           
        </label>

        <label>
            <p>Valor</p>
            <input class="input-currency" type="number" placeholder="10000,00">
        </label>

        <button class="convert-button">Converter</button>

        <section>
            <div class="converter">
                <img class="currency-img" src="./assets/brasil.png" alt="Valor-a-converter">
                <p class="currency-name-to-convert">Real</p>
                <p class="currency-value-to-convert">R$ 0,00</p>
            </div>

            <img src="./assets/seta.png" alt="Seta">

            <div class="convertido">
                <img class="currency-converted-img" src="./assets/brasil.png" alt="Valor-convertido">
                <p class="currency-name-converted">Real</p>
                <p class="currency-value">R$ 0.0</p>
            </div>
        </section>
    </main>

    
</body>
<script src="./script.js"></script>
</html>
